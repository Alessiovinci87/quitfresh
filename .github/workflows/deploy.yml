name: Deploy Frontend to GitHub Pages (DISMESSO)

# Frontend consolidato su Railway (quitfresh.it serve API+SPA dallo stesso
# dominio). GitHub Pages e' deprecato. Lasciamo workflow_dispatch per
# eventuali rollback di emergenza, ma niente piu' trigger automatico
# su push (sprecava build minutes inutilmente).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package.json

      - name: Install dependencies
        run: npm install
        working-directory: client

      - name: Build
        run: npm run build
        working-directory: client
        env:
          # Se il secret è settato lo usa, altrimenti fallback all'URL Railway pubblico.
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://quitfresh-production.up.railway.app' }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
